name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Recreate Android Project Files
        run: flutter create --project-name ai_safeguard .
        
      - name: Get Dependencies
        run: flutter pub get
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-safeguard-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Zip Full Project
        run: zip -r full-project.zip . -x "*.git*"
        
      - name: Upload Full Project
        uses: actions/upload-artifact@v4
        with:
          name: Full-Flutter-Project
          path: full-project.zip
