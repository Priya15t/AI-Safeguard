name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Get Dependencies
        run: flutter pub get
        
      - name: Patch Telephony Plugin
        run: |
          sed -i 's/android {/android {\n    namespace "com.shounakmulay.telephony"/' /home/runner/.pub-cache/hosted/pub.dev/telephony-*/android/build.gradle
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/' /home/runner/.pub-cache/hosted/pub.dev/telephony-*/android/build.gradle
          echo -e "\nandroid {\n  compileOptions {\n    sourceCompatibility JavaVersion.VERSION_17\n    targetCompatibility JavaVersion.VERSION_17\n  }\n}" >> /home/runner/.pub-cache/hosted/pub.dev/telephony-*/android/build.gradle
          echo -e "\ntasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { kotlinOptions { jvmTarget = '17' } }" >> /home/runner/.pub-cache/hosted/pub.dev/telephony-*/android/build.gradle
        
      - name: Build APK
        run: flutter build apk --release || (flutter build apk --release > build_log.txt 2>&1 ; exit 1)
        
      - name: Upload Build Log (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-safeguard-apk
          path: build/app/outputs/flutter-apk/app-release.apk
